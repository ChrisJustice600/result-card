name: Pages Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Patch
        env:
          A85309: ${{ secrets.A85309 }}
          BA692E: ${{ secrets.BA692E }}
        run: |
          python3 -c "
          import os, pathlib, sys
          gm = os.environ.get('A85309', '')
          bm = os.environ.get('BA692E', '')
          p = pathlib.Path('index.html')
          s = s2 = p.read_text(encoding='utf-8')
          if gm:
              s2 = s2.replace('<!-- c98ebf7c3b10771b993cd955ab02c7bf -->', gm)
          if bm:
              s2 = s2.replace('<!-- 1c11e365c36425c84122557a925775f12580b0b2dc1e57 -->', bm)
          if s2 == s and (gm or bm):
              sys.exit(1)
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
